<article class="targeta" >
    <h3>{{obra.titol}}</h3>
    <app-etiqueta-categoria [categoria]="obra.categoria"></app-etiqueta-categoria>
    <p>Vista en data: {{obra.data | date: "dd/MM/yyyy"}}</p>
    @if (obra.valoracio) {<p>{{obra.valoracio}}/5</p>}
    @if (seleccionada) {<p>{{obra.descripcio}}</p>}
    @else {<button type="button" (click)="seleccionar.emit(obra)">Mostra detall</button>}
</article>
