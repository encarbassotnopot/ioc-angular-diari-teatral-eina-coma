<form [formGroup]="formulari" (ngSubmit)="enviar()">
<label for="text">Cerca: </label>
<input type="text" id="text" name="text" formControlName="text" placeholder="Minim 3 caràcters">
@if (mostrarErrors) {<p class="error" id="error-cerca" role="alert">{{missatgeError}}</p>}
<label for="categoria">Categoria: </label>
<select name="categoria" id="categoria" formControlName="categoria">
<option value="">Totes les categories</option>
        @for (categoria of categories; track categoria) {<option [value]="categoria">{{ categoria }}</option>}
</select>
<button type="submit" [disabled]="formulari.invalid || formulari.pending">Filtra</button>
@if (text.value) {
<button type="button" (click)="netejar()">Reestableix</button>
}
</form>
